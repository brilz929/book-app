<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
  <h1>My Book Library</h1>
  </header>

  <main class="book-container">
    <article class="card">
      <div class="card__content">
        <h2 class="card_title">The Hobbit</h2>
        <p class="card_author">by J.R.R. Tolkien</p>
        <p class="card_pages">Pages: 310</p>
        <p class="card_status">Status: Read</p>
        <button class="card_delete-btn" type="button">Delete Book</button>
      </div>
    </article>
  
  <article class="card">
    <div class="card__content">
      <h2 class="card_title">1984</h2>
      <p class="card_author">by George Orwell</p>
      <p class="card_pages">Pages: 328</p>
      <p class="card_status">Status: Not Read</p>
      <button class="card_delete-btn" type="button">Delete Book</button>
    </div>
  </article>
  </main>

  <!-- Pop-up Modal Form -->
  <dialog id="bookDialog">
    <form id="bookForm" method="dialog">
      <h2>Add a New Book</h2>

      <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="form-group">
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required>
      </div>

      <div class="form-group">
        <label for="pages">Pages:</label>
        <input type="number" id="pages" name="pages" min="1" required>
      </div>
      
      <div class="form-group checkbox-group">
        <label for="hasRead">Read:</label>
        <input type="checkbox" id="status" name="hasRead">   
      </div>

      <div class="form-actions">
        <button type="submit" id="submitBtn">Add Book</button>
        <button type="button" id="cancelBtn">Cancel</button>
    </form>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
