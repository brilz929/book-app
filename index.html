<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
  <h1>My Book Library</h1>
  <button id="addBookBtn" type="button">+ Add Book</button>
  </header>

  <main class="book-container">

  </main>

  <!-- Pop-up Modal Form -->
  <dialog id="bookDialog">
    <form id="bookForm" method="dialog">
      <h2>Add a New Book</h2>

      <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="form-group">
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required>
      </div>

      <div class="form-group">
        <label for="pages">Pages:</label>
        <input type="number" id="pages" name="pages" min="1" max="6" required>
      </div>
      
      <div class="form-group checkbox-group">
        <label for="status">Read:</label>
        <input type="checkbox" id="status" name="hasRead">   
      </div>

      <div class="form-actions">
        <button type="submit" id="submitBtn">Add Book</button>
        <button type="button" id="cancelBtn">Cancel</button>
    </form>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
